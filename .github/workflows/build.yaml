name: Build and Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ env.SHORT_SHA }}

      - name: Update manifest image tag in k8s-manifests
        env:
          MANIFEST_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:$MANIFEST_TOKEN@github.com/iitns/k8s-manifests.git /tmp/k8s-manifests
          cd /tmp/k8s-manifests
          sed -i "s|image: .*k3s-gateway:.*|image: ghcr.io/${{ github.repository }}:sha-$SHORT_SHA|" apps/k3s-gateway/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/k3s-gateway/deployment.yaml
          git diff --staged --quiet && exit 0
          git commit -m "ci: k3s-gateway image to sha-$SHORT_SHA [skip ci]"
          git push
