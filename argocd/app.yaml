apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iitns/k3s-gateway
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
